# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`
# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME



# --- Variables ---
$terminal = kitty 
$term = kitty 

$files = kitty -e yazi

$browser = google-chrome-stable # or zen-browser, firefox, etc.

# --- Terminal & Core Apps ---
#bind = SUPER, RETURN, exec, uwsm-app -- $terminal
#bind = SUPER SHIFT, F, exec, uwsm-app -- $fileManager --new-window
unbind = SUPER SHIFT, B
bind = SUPER SHIFT, B, exec, uwsm-app -- $browser --new-window --password-store=basic
bind = SUPER SHIFT CTRL, B, exec, uwsm-app -- $browser --incognito --password-store=basic
bind = SUPER SHIFT, N, exec, uwsm-app -- $terminal -e nvim
bind = SUPER SHIFT, T, exec, uwsm-app -- $term -e btop
bind = SUPER SHIFT, D, exec, uwsm-app -- $terminal -e lazydocker
bind = SUPER SHIFT, O, exec, uwsm-app -- obsidian --disable-gpu --enable-wayland-ime
bind = SUPER SHIFT, V, exec, uwsm-app -- code

# --- Music & Visualizer ---
bindd = $mainMod, C, Open Cava Visualizer, exec, kitty --class cava -e cava
bind = $mainMod SHIFT, M, exec, kitty --class rmpc -e rmpc
bindd = $mainMod SHIFT ALT, M, Switch to Relaxing Music, exec, ~/.config/hypr/UserScripts/switch_to_relax.sh

bind = $mainMod, M, exec, kitty --class cliplayer -e /home/imad/.config/hypr/UserScripts/ytdl-music.sh
# اختصار لتحميل قوائم التشغيل (Super + Alt + D)
bindd = $mainMod ALT, M, Download Playlist, exec, kitty --class "ytdl_playlist" -e ~/.config/hypr/UserScripts/yt-playlist.sh
# اضغط Super + Alt + U لفتح نافذة تحميل الموسيقى
#bind = $mainMod ALT, U, exec, kitty --class "ytdl_popup" -e /home/imad/.config/hypr/UserScripts/ytdl-music.sh

# --- Web Apps (Using Browser App Mode) ---
# Note: This assumes you use a Chromium-based browser (Brave/Chrome/Cachy) for PWA behavior

#$webapp = uwsm-app -- $browser --app=

# --- Web Apps (Using Browser App Mode) ---
# Added a space at the end of the variable below:
# Helper script to launch correctly in Brave App Mode
$webapp = $UserScripts/launch_chrome_webapp.sh 

#bind = SUPER SHIFT, M, exec, $webapp "https://music.youtube.com/"
bind = SUPER SHIFT CTRL, C, exec, $webapp "https://calendar.google.com"
bind = SUPER SHIFT, C, exec, $webapp "https://programmingadvices.com/l/dashboard"
bind = SUPER SHIFT, E, exec, $webapp "https://mail.google.com"
bind = SUPER SHIFT, W, exec, $webapp "https://web.whatsapp.com/"
#bind = SUPER SHIFT, P, exec, $webapp "https://pomofocus.io/app"
bind = SUPER SHIFT, P, exec, kitty -e python3 /home/imad/.config/hypr/UserScripts/pomo.py
bind = SUPER SHIFT CTRL, P, exec, $webapp "https://photos.google.com/"
bind = SUPER SHIFT, G, exec, $webapp "https://github.com"
bind = SUPER SHIFT, A, exec, $webapp "https://claude.ai/new"
bind = SUPER SHIFT, Z, exec, $webapp "https://chat.z.ai/"
bind = SUPER SHIFT, K, exec, $webapp "https://www.kimi.com/"



# Pomodoro Timer Script                                                     
#bind = $mainMod ALT, P, exec, $terminal --class pomo -e $UserScripts/pomo.py



bind = SUPER SHIFT CTRL, A, exec, $webapp "https://aistudio.google.com"
bind = SUPER SHIFT, Y, exec, $webapp "https://youtube.com/"
bind = SUPER SHIFT, X, exec, $webapp "https://x.com/"
bind = SUPER SHIFT CTRL, X, exec, $webapp "https://x.com/compose/post"
bind = SUPER SHIFT CTRL, M, exec, $webapp "https://managementdose.com/l/dashboard"
bind = SUPER SHIFT CTRL, B, exec, $webapp "https://www.busuu.com"

# --- Games ---
bindd = $mainMod, H, Open Hitman Game, exec, env LUTRIS_SKIP_INIT=1 lutris lutris:rungameid/2

# --- Camera ---
bindd = $mainMod ALT, G, Open Guvcview Camera, exec, guvcview

# --- Media Controls (Playerctl) ---
#bind = SUPER, Q, exec, playerctl play-pause && notify-send -t 2000 "Music" "$(playerctl metadata title)"
#bind = SUPER, D, exec, playerctl next && notify-send -t 2000 "Track" "Next: $(playerctl metadata title)"
#bind = SUPER, A, exec, playerctl previous && notify-send -t 2000 "Track" "Prev: $(playerctl metadata title)"

# --- Workspace & Window Management ---
bind = SUPER SHIFT CTRL, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT CTRL, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT CTRL, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT CTRL, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT CTRL, 5, movetoworkspacesilent, 5
bind = SUPER SHIFT CTRL, 6, movetoworkspacesilent, 6
bind = SUPER SHIFT CTRL, 7, movetoworkspacesilent, 7
bind = SUPER SHIFT CTRL, 8, movetoworkspacesilent, 8
bind = SUPER SHIFT CTRL, 9, movetoworkspacesilent, 9

# Switch between Obsidian and CLion using side buttons
bind = $mainMod, mouse:275, exec, hyprctl dispatch focuswindow class:obsidian
bind = $mainMod, mouse:276, exec, hyprctl dispatch focuswindow class:jetbrains-clion





# Mouse thumb button (gesture button) - sends Ctrl+Alt+Tab
bind = $mainMod CTRL ALT, Tab, exec, $scriptsDir/OverviewToggle.sh
bind = CTRL ALT, Tab, exec, $term

# Side roller (Thumb wheel) workspace switching
bind = $mainMod, mouse_left, workspace, e-1
bind = $mainMod, mouse_right, workspace, e+1






# Script to kill workspace (Ensure this script exists in your path)
bind = SUPER ALT, K, exec, ~/.config/hypr/scripts/kill_workspace.sh

# --- Grouping Controls ---
bind = SUPER CTRL, G, togglegroup
bind = CTRL SHIFT, 1, changegroupactive, 1
bind = CTRL SHIFT, 2, changegroupactive, 2
bind = CTRL SHIFT, 3, changegroupactive, 3
bind = CTRL SHIFT, 4, changegroupactive, 4
bind = CTRL SHIFT, 5, changegroupactive, 5
bind = CTRL SHIFT, 6, changegroupactive, 6
bind = CTRL SHIFT, 7, changegroupactive, 7
bind = CTRL SHIFT, 8, changegroupactive, 8
bind = CTRL SHIFT, 9, changegroupactive, 9

#bind = SUPER ALT, left, changegroupactive, b
#bind = SUPER ALT, right, changegroupactive, f
#bind = SUPER ALT, L, lockactivegroup, toggle





# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset

# Brightness control (Fn + Z/X equivalent using Super)
binded = $mainMod, Z, Decrease Brightness, exec, $scriptsDir/Brightness.sh --dec
binded = $mainMod, X, Increase Brightness, exec, $scriptsDir/Brightness.sh --inc

# Brightness control using Mouse Wheel
unbind = $mainMod, mouse_down
unbind = $mainMod, mouse_up
bind = $mainMod SHIFT, mouse_down, exec, $scriptsDir/Brightness.sh --dec
bind = $mainMod SHIFT, mouse_up, exec, $scriptsDir/Brightness.sh --inc

# Close window with Middle Click
bind = $mainMod, mouse:274, killactive
