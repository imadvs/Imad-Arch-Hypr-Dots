# User Window Rules

# JetBrains IDE Optimizations (CLion, Rider, IntelliJ, etc.)

# 1. Performance: Disable animations (using 'on' value for strict parser)


# 2. Rendering: Force full opacity# Obsidian Opacity Rule
windowrule = match:class ^(obsidian)$, opacity 0.9 0.8
windowrule = match:class ^(jetbrains-.*)$, opacity 0.9 0.8


# 3. Focus/Splash Screen Fixes:
# Center the splash screen/welcome dialog
windowrule = match:class ^(jetbrains-.*)$ match:title ^(Welcome to.*)$, center on
windowrule = match:class ^(jetbrains-.*)$ match:title ^(splash)$, center on

# Prevent initial focus stealing
# Use 'match:title' syntax and 'on' value
windowrule = match:class ^(jetbrains-.*)$ match:title ^$, no_initial_focus on
windowrule = match:class ^(jetbrains-.*)$ match:title ^(win.*)$, no_initial_focus on

# Force CLion to Workspace 1
windowrule = match:class ^(jetbrains-clion)$, workspace 1 silent
