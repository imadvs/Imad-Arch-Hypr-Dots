# Schedule Configuration
# Format: SITE|START_TIME|END_TIME|DAYS
# Days: mon,tue,wed,thu,fri,sat,sun (or "all" for every day)

# Block Instagram and YouTube from 8 AM to 8 PM every day
instagram.com|08:00|17:00|all
www.instagram.com|08:00|17:00|all
youtube.com|08:00|17:00|all
www.youtube.com|08:00|17:00|all
m.youtube.com|08:00|17:00|all

# YouTube Music (music.youtube.com) remains accessible at all times!

# If you want to block only on weekdays (Mon-Fri) instead:
# instagram.com|08:00|20:00|mon,tue,wed,thu,fri
# youtube.com|08:00|20:00|mon,tue,wed,thu,fri
